- id: geojson
  conforms: true
  standard: GeoJSON
  spec: RFC 7946
  domain_standard: true
  market: agriculture / geospatial
  evidence: >-
    Three dedicated operations serve GeoJSON — GET /geojson/sites,
    GET /geojson/customer/{customerID} and GET /geojson/site/{siteID}. The provider's
    documented response body is a conformant FeatureCollection: "type":
    "FeatureCollection" at the root, features[] of "type": "Feature" each with
    properties{} and geometry{}, and node geometry as {"type":"Point","coordinates":
    [-122.602875, 45.556985]} in RFC 7946 longitude-then-latitude order with WGS 84
    decimal degrees.
  evidence_url: https://github.com/agrology/public-api-docs/blob/main/README.md#geojson-format
  deviations:
  - >-
    Non-standard sibling members (key, description, historicalURL, predictionsURL,
    syntheticsURL, sites[]) are added at the FeatureCollection root. RFC 7946 permits
    foreign members, so this remains conformant; a strict parser ignores them.
  - >-
    The site Feature is published with an empty geometry object ({}) rather than null.
    RFC 7946 requires geometry to be a Geometry object or null; {} is neither.
  significance: >-
    This is the domain standard that matters for this market. A grower using QGIS, a
    farm-management platform, or any PostGIS-backed stack ingests Agrology field
    geometry with no bespoke connector, and the templated historicalURL /
    predictionsURL / syntheticsURL members carried inside the GeoJSON take a consumer
    straight from a mapped node to its telemetry.
  method: searched
