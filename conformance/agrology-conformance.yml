  - id: sparkplug
    reason: >-
      No MQTT/Sparkplug topic namespace is published. The sensor network's uplink
      transport is not exposed through the Public API, which is HTTP/JSON only.
  - id: ogc-api
    reason: >-
      Probed by evidence, not by blind pattern. The API serves GeoJSON but declares no
      OGC API landing page, no conformsTo[] with opengis.net class URIs, and no
      /collections resource; no WMS/WFS/WCS/WMTS/CSW GetCapabilities surface is named
      anywhere in the docs or the shipped client bundles. Agrology is a GeoJSON
      publisher, not an OGC service.
  - id: ads-abi
    reason: >-
      ADAPT / AgGateway ADS is the interoperability standard for machinery and
      field-operation data exchange. Agrology publishes environmental sensing data, not
      machine task data, and names no ADAPT, ISOXML or ISO 11783 support.
