  documents_found: 0
  finding: >-
    NOT ONE well-known document is served on any Agrology host. No pointer of type
    WellKnown, APICatalog, SecurityTxt or AgentCard is emitted from this file, because
    every probe either 404'd, returned 403 from an authenticated gateway, or returned a
    single-page-app HTML shell under a 200. A 200 carrying an SPA shell is NOT a
    document and is recorded here as a miss.
  spa_catch_all_warning: >-
    agrology.ag, www.agrology.ag and grower.agrology.ag are client-rendered Vite/React
    applications whose servers answer HTTP 200 with the same index shell for EVERY
    unmatched path. The identical shell is returned for /robots.txt, /llms.txt,
    /sitemap.xml and a deliberately bogus control path
    (/zzz-not-a-real-path-12345, 200, 454 bytes, byte-identical). Status code alone is
    worthless on these hosts; every result below was classified by reading the body.
