recommendation_to_provider: >-
  A /.well-known/security.txt on agrology.ag and a /.well-known/api-catalog pointing at
  https://github.com/agrology/public-api-docs would both be a few lines of static text,
  and would make a contract the company already publishes openly discoverable by machine.
  Serving the SPA shell under 200 for unmatched paths also actively breaks automated
  discovery, because no crawler can distinguish a missing file from a served one.
