  - GET /experiments/{customerID}/{id}
  - POST /experiments/customer/{customerID}
  - PUT /experiments/{customerID}/{id}
  - DELETE /experiments/{customerID}/{id}
  - GET /experiments/groups/{customerID}/{experimentID}
  - GET /experiments/groups/{customerID}/{experimentID}/{id}
  - POST /experiments/groups/{customerID}/{experimentID}
  - PUT /experiments/groups/{customerID}/{experimentID}/{id}
  - DELETE /experiments/groups/{customerID}/{experimentID}/{id}
  - GET /experiments/members/{customerID}/{experimentID}/{groupID}/{nodeID}
  - GET /experiments/members/{customerID}/group-id/{groupID}
  - GET /experiments/members/{customerID}/node-id/{nodeID}
  - GET /experiments/members/{customerID}/experiment-id/{experimentID}
  - POST /experiments/members/{customerID}/{experimentID}/{groupID}/{nodeID}
  - PUT /experiments/members/{customerID}/{experimentID}/{groupID}/{nodeID}
  - DELETE /experiments/members/{customerID}/{experimentID}/{groupID}/{nodeID}
  - GET /experiments/metrics/{customerID}/{experimentID}/{id}
  - GET /experiments/metrics/{customerID}/experiment-id/{experimentID}
  - POST /experiments/metrics/{customerID}/experiment-id/{experimentID}
  - PUT /experiments/metrics/{customerID}/{experimentID}/{id}
  - DELETE /experiments/metrics/{customerID}/{experimentID}/{id}
  - GET /experiments/data/{customerID}/e/{experimentID}/{resolution}/{timeRange}
  - GET /experiments/data/{customerID}/e/{experimentID}/g/{groupID}/{resolution}/{timeRange}
  - POST /experiments/data/{customerID}/e/{experimentID}/run
  - POST /experiments/data/{customerID}/e/{experimentID}/regenerate
  warning: >-
    None of the experiment deletes is reversible. The regenerate call discards and
    rebuilds computed data.
- name: manage_workspace
  description: Manage dashboards, library charts, customer inputs and user access grants
    for a customer.
  category: workspace
  read_only: false
  destructive: true
  rest:
  - GET /dashboards/owner/{owner}
  - GET /dashboards/owner/{owner}/feature-id/{featureID}
  - GET /dashboards/{owner}/{id}
  - POST /dashboards/owner/{owner}
  - PUT /dashboards/{owner}/{id}
  - DELETE /dashboards/{owner}/{id}
  - POST /dashboards/{owner}/{id}
  - GET /library-charts/customer/{customerID}
  - GET /library-charts/{customerID}/{id}
  - POST /library-charts/customer/{customerID}
  - PUT /library-charts/{customerID}/{id}
  - DELETE /library-charts/{customerID}/{id}
  - GET /customer-inputs/customer/{customerID}
  - GET /customer-inputs/customer/{customerID}/category/{category}
  - GET /customer-inputs/categories
  - POST /customer-inputs/customer/{customerID}
  - PUT /customer-inputs/{customerID}/{id}
  - DELETE /customer-inputs/{customerID}/{id}
  - GET /access/manage/{customerID}
  - POST /access/manage/{customerID}/{accessUser}/{accessLevel}
  - DELETE /access/manage/{customerID}/{accessUser}
  operation_ids_available:
  - showLibraryChart
  - updateLibraryChart
  - deleteLibraryChart
  - listLibraryChartsByCustomerID
  - createLibraryChart
  warning: >-
    Dashboard delete IS reversible — POST to the same item path undeletes it. Library
    chart, customer input and access-grant deletes are NOT. Granting access changes who
    can see a customer's agronomic data; treat POST /access/manage as high consequence.
- name: submit_feedback
  description: File feature requests, bug reports or other feedback about the Agrology
    platform, optionally requesting follow-up.
  category: support
  read_only: false
  rest:
  - POST /feedback
  note: >-
    The only fully-described request schema in the spec. Set isTestMessage true for any
    non-genuine submission so the customer-success team can ignore it.
agent_readiness_notes:
- No public MCP server, so nothing here is agent-callable today.
- Credentials are not machine-friendly — the self-service bearer token is a 1-hour JWT
  copied by hand from a web UI, and the durable API key requires contacting staff.
- No error responses are declared anywhere in the spec, so a tool wrapper has no typed
  failure path.
- No idempotency on any of the 31 writes; retries on collection POSTs duplicate.
- Historical values are restated when models are retrained
  (lifecycle/agrology-lifecycle.yml), so an agent must not treat past telemetry as
  immutable.
