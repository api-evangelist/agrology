candidate_tools:
  note: >-
    Derived by grouping the 90 published OpenAPI operations into agent-sized tools. Every
    rest[] entry is a verbatim METHOD + path from the spec. The spec assigns
    operationIds to only 5 of its 90 operations, so most bindings can only be expressed
    as method+path — that is the provider's gap, not an omission here.
  tool_count: 15
  coverage: 90 of 90 operations
  auth_model: >-
    Any real server would pass through the caller's bearer JWT or x-api-key; every
    operation is credentialed and entity-scoped, so a tool must never hold a shared key.
tools:
- name: list_my_access
  description: List every customer, site and node the current credential can reach, with
    the caller's role per site. The mandatory first call — nothing else can be addressed
    without ids from here.
  category: discovery
  read_only: true
  rest:
  - GET /access
- name: list_sites_and_nodes
  description: List the sites and sensor nodes available to the caller.
  category: topology
  read_only: true
  rest:
  - GET /sites
  - GET /nodes
- name: get_field_geometry
  description: Fetch field and sensor-node geometry as a GeoJSON FeatureCollection, for
    a single site, a whole customer, or everything the caller can see. Also returns
    templated links to the matching telemetry endpoints.
  category: geospatial
  read_only: true
  rest:
  - GET /geojson/sites
  - GET /geojson/site/{siteID}
  - GET /geojson/customer/{customerID}
- name: list_metrics
  description: Resolve the metric vocabulary for a dataset — metric ids, display names
    and units. Must be called before filtering by metric, because metric ids are data,
    not a fixed schema.
  category: vocabulary
  read_only: true
  rest:
  - GET /metrics
  - GET /historical/ground-truth/metrics
  - GET /historical/ground-truth/device-types
  - GET /historical/weather/metrics
  - GET /predictions/microclimate/metrics
  - GET /predictions/weather/metrics
  - GET /synthetics/microclimate/metrics
- name: get_ground_truth_history
  description: Retrieve measured in-field sensor telemetry for a site, node or device
    over a time range, optionally filtered by device type and metric.
  category: telemetry
  read_only: true
  rest:
  - GET /historical/ground-truth/{siteID}/{timeRange}
  - GET /historical/ground-truth/{siteID}/node/{nodeID}/{timeRange}
  - GET /historical/ground-truth/{siteID}/device/{deviceID}/{timeRange}
  - GET /historical/ground-truth/{siteID}/devices
- name: get_weather_history
  description: Retrieve historical weather-service data (sourced from Tomorrow.io) for a
    site or node over a time range.
  category: telemetry
  read_only: true
  rest:
  - GET /historical/weather/{siteID}/{timeRange}
  - GET /historical/weather/{siteID}/node/{nodeID}/{timeRange}
- name: get_microclimate_forecast
  description: Retrieve Agrology microclimate predictions — up to four days ahead — for a
    site or node. Omitting the time range returns all future predictions from now.
  category: predictions
  read_only: true
  rest:
  - GET /predictions/microclimate/{siteID}
  - GET /predictions/microclimate/{siteID}/{timeRange}
  - GET /predictions/microclimate/{siteID}/node/{nodeID}
  - GET /predictions/microclimate/{siteID}/node/{nodeID}/{timeRange}
- name: get_weather_forecast
  description: Retrieve weather-service forecasts (Tomorrow.io) for a site or node, up to
    four days ahead.
  category: predictions
  read_only: true
  rest:
  - GET /predictions/weather/{siteID}
  - GET /predictions/weather/{siteID}/{timeRange}
  - GET /predictions/weather/{siteID}/node/{nodeID}
  - GET /predictions/weather/{siteID}/node/{nodeID}/{timeRange}
- name: get_synthetic_microclimate
  description: Retrieve ML-synthesized historical microclimate metrics (for example
    volumetric water content) derived from measured ground truth.
  category: telemetry
  read_only: true
  rest:
  - GET /synthetics/microclimate/{siteID}/{timeRange}
  - GET /synthetics/microclimate/{siteID}/node/{nodeID}/{timeRange}
  - GET /summaries/microclimate/customer/{customerID}
- name: list_alerts
  description: List threshold alerts raised for a customer — frost, extreme heat and
    other configured insights — with affected sites and geographic points.
  category: alerts
  read_only: true
  rest:
  - GET /alerts/customer/{customerID}
- name: get_file_download_url
  description: Exchange an s3:// file location returned in another response for a
    short-lived pre-signed download URL.
  category: files
  read_only: true
  rest:
  - GET /fileserver/customer/{customerID}
  - GET /fileserver/customer/{customerID}/shared
  - GET /fileserver/site/{siteID}
- name: manage_reports
  description: List, create, update and delete report definitions, and list, inspect and
    trigger report runs.
  category: reporting
  read_only: false
  destructive: true
  rest:
  - GET /report-definitions/customer/{customerID}
  - POST /report-definitions/customer/{customerID}
  - PUT /report-definitions/{customerID}/{id}
  - DELETE /report-definitions/{customerID}/{id}
  - GET /report-runs/customer/{customerID}
  - GET /report-runs/{customerID}/{id}
