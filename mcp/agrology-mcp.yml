internal_server_observed:
  note: >-
    Recorded as evidence, deliberately NOT promoted into deployment.endpoint. Agrology
    does appear to run an MCP server, but it is an internal one and it is not an agent
    surface any third party can use.
  configured_base_url: https://mcp.internal.agrology.ag
  where_found: >-
    The production Grower's Portal build at https://grower.agrology.ag/ carries a config
    object naming mcpBaseUrl "https://mcp.internal.agrology.ag" alongside apiBaseUrl
    "https://api.agrology.ag/v2" and prodHostname "grower.agrology.ag". The value is the
    provider's own, read verbatim from the shipped bundle; it was not guessed.
  hostname_signal: >-
    The ".internal." label is the provider's own statement of intent — this endpoint is
    not meant for public consumption.
  probes:
  - url: https://mcp.internal.agrology.ag/
    method: POST
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    status: 403
    response: '{"error":"CSRF check failed"}'
  - url: https://mcp.internal.agrology.ag/mcp
    method: POST
    status: 404
    response: Next.js HTML 404 page
  - url: https://mcp.internal.agrology.ag/sse
    method: POST
    status: 404
    response: Next.js HTML 404 page
  conclusion: >-
    The host answers as a Next.js web application, not as a JSON-RPC MCP transport. No
    tools/list response, no OAuth challenge, no MCP session header. Either the MCP
    transport sits behind an authenticated route, or the name is aspirational. Either
    way there is no anonymously verifiable MCP surface, so no tool inputSchema could be
    introspected and none is claimed here.
