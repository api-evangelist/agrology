shared_rules:
  note: >-
    Every skill repeats these because an agent may load only one of them.
  rules:
  - Call GET /access first — authorization is an entity access list, not OAuth scopes.
  - Identifier shapes are not uniform; never validate a customerID or siteID as a UUID.
  - Metric ids are runtime data from the /metrics endpoints, not a fixed schema.
  - The time range is a path segment; the hyphen is required even when the end is omitted.
  - There is no pagination; the time range and the filters are the only volume control.
  - No idempotency on any of the 31 writes — never blind-retry a collection POST.
  - Only DELETE /dashboards/{owner}/{id} is reversible; every other delete is permanent.
  - No operation declares a 4xx or 5xx; errors are untyped.
  - A missing credential returns 403 (the README says 401); an invalid one returns 401.
  - No rate limits and no Retry-After are published.
  - Historical values are restated when models are retrained; record the fetch time.
