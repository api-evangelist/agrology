note: >-
  Agrology publishes NO rate limits for the Public API v2. The 18KB provider README
  covers authentication, time ranges, filtering, ordering, every dataset and the file
  flow, and never mentions throttling, quotas, burst allowances or a 429. The 71KB
  OpenAPI declares no 429 response on any of its 90 operations. Live unauthenticated
  probes of https://api.agrology.ag/v2/access returned no X-RateLimit-*, no RateLimit-*
  and no Retry-After header on either the 403 (no credential) or the 401 (invalid key)
  response. An honest zero: this was checked, not skipped.
