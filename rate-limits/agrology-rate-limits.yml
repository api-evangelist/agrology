infrastructure_note: >-
  The API is served by Amazon API Gateway (x-amzn-requestid, x-amz-apigw-id,
  MissingAuthenticationTokenException). API Gateway applies account-level throttling and
  can enforce per-key usage plans by default, so limits very likely exist at the
  platform layer — but Agrology publishes none of them, so their values, windows and
  exhaustion behaviour are unknown to a consumer. This is an inference about the
  infrastructure, NOT a recorded limit, and nothing is claimed as a number.
volume_control_actually_published:
  note: >-
    In place of rate limits, the published mechanism for bounding cost is payload size:
    the {timeRange} path segment and the optional deviceType / metrics query filters
    decide how much data one call returns. There is no pagination, so a wide time range
    is a single large response rather than many small ones.
  parameters:
  - '{timeRange} path segment'
  - '?deviceType='
  - '?metrics='
agent_impact: >-
  An agent cannot pre-compute a safe call rate, cannot detect throttling from a
  documented status code, and has no Retry-After to back off against. The safe posture
  is conservative concurrency, exponential backoff on any 429 or 5xx, and narrow time
  ranges with explicit metric filters rather than unfiltered wide-range pulls.
recommendation_to_provider: >-
  Publishing the API Gateway usage-plan values already in force, and returning
  Retry-After on throttle, would cost nothing to operate and would let machine clients
  behave correctly.
