- id: customer-alerts
  operation: GET /alerts/customer/{customerID}
  url: https://api.agrology.ag/v2/alerts/customer/{customerID}
  description: >-
    Threshold alerts aggregated for one customer. The envelope carries an `aps` block —
    an Apple Push Notification payload — revealing that this endpoint doubles as the
    mobile push feed. startTime/updateTime are ISO-8601 here, unlike the epoch integers
    used elsewhere in the API.
  provider_truncated: false
