aid: agrology
name: Agrology
description: 'Agrology is a Delaware Public Benefit Corporation building a predictive
  agriculture platform for specialty crops, vineyards and regenerative row-crop operations.
  Its patented in-field sensor nodes capture ground-truth agronomic telemetry — soil
  moisture and tension, soil and air temperature, humidity, vapor pressure deficit,
  barometric pressure, total VOCs, CO2 and nitrous-oxide flux — and feed machine-learning
  models that produce microclimate predictions, synthetic metrics and threshold alerts
  for frost, extreme heat, irrigation and smoke taint. The company publishes a first-party
  Agrology Public API v2 (OpenAPI 3.0.1, 90 operations at https://api.agrology.ag/v2)
  from its own GitHub organization, covering site and node topology, GeoJSON geometry,
  historical ground-truth and weather data, microclimate and weather predictions, alerts,
  reports, dashboards, charts and field experiments.'
image: https://avatars.githubusercontent.com/u/55110899?v=4
url: https://raw.githubusercontent.com/api-evangelist/agrology/refs/heads/main/apis.yml
