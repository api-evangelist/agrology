- name: Agrology Public API v2
  description: 'The Agrology Public API v2 exposes site and node configuration, GeoJSON
    geometry, historical ground-truth sensor telemetry, historical and forecast weather
    service data, ML-derived synthetic microclimate metrics, microclimate predictions,
    customer alerts, report definitions and runs, library charts, dashboards, customer
    inputs and field experiments. All requests are authenticated with a Cognito-issued
    bearer JWT or an Agrology-issued x-api-key.'
