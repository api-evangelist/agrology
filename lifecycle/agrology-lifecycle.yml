model_versioning:
  published: true
  url: https://agrology.ag/model-updates
  title: Why your data sometimes looks a little different
  last_reviewed: '2026-05-27'
  method: searched
  source: >-
    The page is rendered client-side; its content was read from the shipped React bundle
    at https://agrology.ag/assets/index-C7n1vIou.js, which carries the page copy and the
    lastReviewed date inline.
  scope: ML model releases, not API contract releases
  summary: >-
    Agrology publishes a standing policy on ML model retraining and the RETROACTIVE DATA
    RESTATEMENT it causes. Updated models change the values returned for dates in the
    PAST as well as the present — today's readings shift slightly, recent history shifts,
    and derived aggregates (monthly averages, growing-season totals) move with them. The
    company states the shape of the data (peaks, dry-downs, seasonal patterns) is
    expected to remain familiar while precision improves. Retraining is triggered by new
    ground-truth data, research-partner datasets, science-team edge-case fixes, or
    expansion into new soil types, climates and crops.
  triggers:
  - new ground-truth data from Agrology's own measurements
  - a fresh batch contributed by a research partner
  - a better handling of an edge case found by the science team
  - expansion into new soil types, climates or crops
  release_notice: >-
    The policy says the company will tell customers when a change is "meaningful enough",
    but names no channel, no versioning of model releases, and no per-response model
    identifier.
  agent_impact: >-
    THIS IS THE MOST CONSEQUENTIAL LIFECYCLE FACT FOR A CONSUMER OF THIS API. Historical
    telemetry is NOT immutable. A value cached or reconciled against an earlier fetch can
    legitimately differ on refetch with no error, no version change and no header to
    detect it by. Any agent building a ledger, a carbon claim, or a compliance record
    from Agrology synthetics or predictions must record the fetch time alongside the
    value and must expect restatement. There is no published way to pin a model version
    or request the values as-of a prior model.
  affected_datasets:
  - synthetics/microclimate
  - predictions/microclimate
  - historical/ground-truth (derived metrics)
  unaffected: >-
    Raw measured sensor values are not described as being restated; the policy concerns
    the models that "turn raw sensor measurements into the readings you actually use".
