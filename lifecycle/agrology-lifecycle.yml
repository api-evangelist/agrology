  last_push: '2026-07-01'
  license: Apache-2.0
  method: searched
  source: https://api.github.com/repos/agrology/public-api-docs
  note: >-
    Publishing the contract under Apache-2.0 in a public repository is a deliberate and
    uncommon choice — it makes the spec forkable and gives consumers a dated, diffable
    record of contract change in the absence of a changelog.
gaps:
- No deprecation or sunset policy, and no Sunset/Deprecation headers.
- No status page — outages are undetectable to a machine client.
- No dated changelog; commit history is the only substitute.
- No SLA or uptime commitment.
- Three unreconciled version numbers (path v2, info.version 1.0.0, responseVersion 2.1).
- Model releases restate historical data with no version identifier, no as-of query and
  no notification channel an agent can subscribe to.
