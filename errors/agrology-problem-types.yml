  confidence: medium
  remediation: >-
    Call GET /access first and only address customers, sites and nodes it returns.
  retryable: false
- id: malformed-time-range
  status: unknown
  title: Time range does not parse
  method: derived
  evidence: >-
    Derived from the README's Time Ranges rules, which are strict: relative units are
    limited to s/m/h/d/w, compound relative times such as 2h5m are unsupported, epoch
    seconds must be exactly 10 digits, epoch milliseconds exactly 13, and the two
    human-readable forms exactly 12 and 14 digits beginning with '20'. The hyphen
    separator is required even when the end time is omitted.
  confidence: medium
  note: >-
    The docs state the constraints but never state the failure status or body. Unknown
    is the honest value; do not assume 400.
  remediation: Zero-pad timestamps, never trim, and always include the trailing hyphen.
  retryable: false
