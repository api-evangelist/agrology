problem_types:
- id: missing-authentication-token
  status: 403
  title: No credential presented
  envelope: '{"message":"Forbidden"}'
  aws_error_type: MissingAuthenticationTokenException
  method: probed
  evidence: >-
    GET https://api.agrology.ag/v2/access with no Authorization and no x-api-key header
    returned HTTP 403 with x-amzn-errortype: MissingAuthenticationTokenException
    (probed 2026-09-13).
  remediation: >-
    Attach either 'Authorization: Bearer $ACCESS_TOKEN' or 'x-api-key: $API_KEY'.
  contradiction: >-
    The README states that "Any API request without a Bearer Token or API Key will be
    rejected with a 401 Unauthorized error". The observed status is 403, not 401. An
    agent branching only on 401 will misclassify the unauthenticated case as a
    permissions failure and may retry forever.
  retryable: false
- id: unauthorized
  status: 401
  title: Credential present but rejected
  method: probed
  evidence: >-
    GET https://api.agrology.ag/v2/access with 'x-api-key: not-a-real-key' returned
    HTTP 401 (probed 2026-09-13).
  causes:
  - Invalid or revoked API key.
  - Expired bearer token — Cognito access tokens expire 1 hour after issue.
  remediation: >-
    For a bearer token, return to https://grower.agrology.ag/ and collect a fresh one
