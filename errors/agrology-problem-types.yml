- id: forbidden-entity
  status: 403
  title: Credential valid but the entity is outside the caller's access list
  method: derived
  evidence: >-
    Derived from the documented authorization model: every data path is scoped by
    {customerID}, {siteID} or {nodeID}, and GET /access returns the caller's permitted
