datasets:
  note: >-
    Five interchangeable time-series datasets share one response envelope and one
    addressing scheme (site, node, optional device, time range). Choosing between them
    is choosing a provenance, not a different API.
  sets:
  - id: historical/ground-truth
    provenance: Agrology in-field sensors (measured)
  - id: historical/weather
    provenance: Tomorrow.io weather service (third-party, measured)
  - id: synthetics/microclimate
    provenance: Agrology ML models applied to historical ground-truth to synthesize
      additional metrics over past time
  - id: predictions/microclimate
    provenance: Agrology statistical model over weather forecasts + ground-truth
    horizon: up to 4 days ahead
  - id: predictions/weather
    provenance: Tomorrow.io forecast (third-party)
    horizon: up to 4 days ahead
third_party_data:
  tomorrow_io:
    role: supplies historical weather service data and weather predictions
    url: https://tomorrow.io
    source: https://github.com/agrology/public-api-docs/blob/main/README.md
gaps:
- The core telemetry entities (Customer, Site, Node, Device, Metric, Sample, Alert)
  have no declared schema; their shapes are only knowable from README examples.
- The README states explicitly that it "does not describe the relationship between
  Customers, Sites, Nodes" and directs readers to contact Agrology — the relationships
  above are derived from path structure and example bodies, not from a published ERD.
- LibraryChart.definition and Dashboard layout grammars are unpublished strings.
- The accessLevel and role vocabularies are unpublished.
